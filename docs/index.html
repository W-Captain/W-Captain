<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STARSHIP — W-CAPTAIN</title><style>
*{box-sizing:border-box}body{margin:0;background:#070d13;color:#e5eee6;font-family:'Avenir Next',system-ui,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}#landing{min-height:100svh;display:grid;place-content:center;padding:32px;max-width:1080px;margin:auto}#landing img{width:100%;display:block}#landing a{display:block;color:inherit;text-decoration:none;transition:transform .4s}#landing a:hover{transform:translateY(-4px)}.entry{display:flex;justify-content:space-between;align-items:center;padding:24px 4px;gap:20px}.entry span{color:#98aaa9;font-size:14px}.entry strong{font-weight:500;color:#c7e9cc}#game{display:none;height:100svh;min-height:440px;position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;gap:20px;padding:28px 36px;pointer-events:none;background:linear-gradient(#070d13cc,transparent)}.brand{font-size:12px;letter-spacing:4px}.sub{font-size:10px;color:#879d9e;margin-top:9px;letter-spacing:2px}.stats{display:flex;gap:30px;align-items:start}.stat small{display:block;font-size:10px;letter-spacing:2px;color:#879d9e}.stat b{display:block;font:23px monospace;margin-top:6px;font-weight:400}.hud button{pointer-events:auto;border:1px solid #526666;background:#111e26;color:#deeadf;border-radius:50%;width:38px;height:38px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#060e1470;backdrop-filter:blur(5px);padding:24px}.panel{text-align:center;max-width:540px}.eyebrow{font:11px monospace;letter-spacing:4px;color:#badbc5}.panel h1{font-size:clamp(42px,8vw,84px);font-weight:400;letter-spacing:-3px;margin:20px 0}.panel p{color:#a6b9b8;font-size:15px;line-height:1.9;margin:8px 0}.primary{background:#c4e5c9;color:#12241e;padding:15px 35px;border:0;border-radius:4px;margin-top:26px;font-weight:600}.secondary{display:block;margin:18px auto 0;background:none;border:0;color:#92aaa8;font-size:12px}.hint{position:absolute;bottom:22px;width:100%;text-align:center;pointer-events:none;color:#748d90;font-size:11px;letter-spacing:1px}.hidden{display:none!important}@media(max-width:600px){#landing{padding:18px}.entry{flex-direction:column;align-items:start}.hud{padding:22px 18px}.stats{gap:15px}.stat b{font-size:18px}.brand{letter-spacing:2px}.sub{letter-spacing:0}.hint{font-size:10px}}
</style><section id="landing"><a href="#play" id="board"><img src="cover.svg" alt="W-CAPTAIN 星舰，点击登舰开始游戏"><div class="entry"><span>前方有陨石。飞船交给你了。<br>Asteroids ahead. You have the controls.</span><strong>登舰 / BOARD THE SHIP ↗</strong></div></a></section>
<section id="game" aria-label="星舰躲陨石游戏"><canvas id="space" aria-label="方向键或 WASD 移动，手机拖动飞船，P 暂停"></canvas><header class="hud"><div><div class="brand">STARSHIP</div><div class="sub">W-CAPTAIN / MINI ARCADE</div></div><div class="stats"><div class="stat"><small>SCORE</small><b id="score">0000</b></div><div class="stat"><small>SHIELD</small><b id="shield">● ● ●</b></div><button id="pause" aria-label="暂停游戏">Ⅱ</button></div></header><div class="overlay" id="overlay"><div class="panel"><div class="eyebrow" id="eyebrow">W-CAPTAIN / MINI ARCADE</div><h1 id="title">STARSHIP</h1><p id="description">躲过陨石，飞得再远一点。<br>方向键 / WASD 移动 · 手机拖动驾驶<br>收集绿色能量补充护盾，擦肩而过也会得分。</p><button class="primary" id="start">启航 / LAUNCH</button><button class="secondary" id="home">返回 GitHub / GITHUB</button></div></div><div class="hint">MOVE / WASD · ARROWS · DRAG &nbsp; / &nbsp; PAUSE / P</div></section>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('space'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,state='ready',last=0,time=0,score=0,hp=3,rocks=[],sparks=[],orbs=[],stars=[],spawn=0,energy=0,inv=0,shake=0,keys=new Set(),pointer=null,ship={x:0,y:0},best=0;
try{best=Number(localStorage.getItem('starship-best'))||0}catch{}
function resize(){let ow=W,oh=H;W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ship.x=ow?ship.x*W/ow:W/2;ship.y=oh?ship.y*H/oh:H*.78;stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*1.5+.3}));}
function hud(){$('score').textContent=String(Math.floor(score)).padStart(4,'0');$('shield').textContent='● '.repeat(hp)+'○ '.repeat(3-hp)}
function show(title,desc,button){$('title').textContent=title;$('description').innerHTML=desc;$('start').textContent=button;$('overlay').classList.remove('hidden')}
function begin(){state='playing';time=score=spawn=energy=inv=shake=0;hp=3;rocks=[];orbs=[];sparks=[];ship={x:W/2,y:H*.78};pointer=null;keys.clear();$('overlay').classList.add('hidden');hud()}
function toggle(){if(state==='playing'){state='paused';keys.clear();pointer=null;show('在这里停一会儿。','飞船已暂停。<br>Your ship can wait.','继续 / RESUME')}else if(state==='paused'){state='playing';$('overlay').classList.add('hidden')}}
function end(){state='over';best=Math.max(best,Math.floor(score));try{localStorage.setItem('starship-best',best)}catch{}$('eyebrow').textContent='SIGNAL LOST';show('下次绕远一点。',`本次得分 ${Math.floor(score)} · 航行 ${Math.floor(time)} 秒<br>个人最佳 ${best} / PERSONAL BEST`,'再飞一次 / RETRY')}
$('board').onclick=e=>{e.preventDefault();$('landing').style.display='none';$('game').style.display='block';resize();state='ready'};
$('home').onclick=()=>{location.href='https://github.com/W-Captain'};
$('start').onclick=()=>state==='paused'?toggle():begin();$('pause').onclick=toggle;
addEventListener('resize',resize);addEventListener('keydown',e=>{if($('game').style.display!=='block')return;let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','p',' '].includes(k))e.preventDefault();if(k==='p'&&!e.repeat)toggle();else keys.add(k)});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{if(state==='playing')toggle();keys.clear()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')toggle()});
canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;canvas.setPointerCapture(e.pointerId);pointer={x:e.clientX,y:e.clientY};});canvas.addEventListener('pointermove',e=>{if(pointer)pointer={x:e.clientX,y:e.clientY}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>pointer=null);
function burst(x,y,color,n=18){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=30+Math.random()*160;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.5,color})}}
function update(dt){time+=dt;score+=dt*10;inv=Math.max(0,inv-dt);shake=Math.max(0,shake-dt*22);let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);let speed=Math.min(W,H)*.75;if(pointer){dx=pointer.x-ship.x;dy=pointer.y-36-ship.y;let len=Math.hypot(dx,dy);if(len>1){let step=Math.min(len,speed*1.5*dt);ship.x+=dx/len*step;ship.y+=dy/len*step}}else{let len=Math.hypot(dx,dy)||1;ship.x+=dx/len*speed*dt;ship.y+=dy/len*speed*dt}ship.x=Math.max(20,Math.min(W-20,ship.x));ship.y=Math.max(105,Math.min(H-38,ship.y));spawn-=dt;energy-=dt;
if(spawn<=0){let r=16+Math.random()*26;rocks.push({x:r+Math.random()*(W-2*r),y:-r,r,v:115+Math.min(time*3,200)+Math.random()*60,vx:(Math.random()-.5)*36,a:Math.random()*6,spin:(Math.random()-.5)*1.2,shape:Array.from({length:9},()=>.7+Math.random()*.3),passed:false});spawn=Math.max(.23,.85-time*.008)}
if(energy<=0){orbs.push({x:30+Math.random()*(W-60),y:-20});energy=8+Math.random()*4}
for(let r of rocks){r.y+=r.v*dt;r.x+=r.vx*dt;r.a+=r.spin*dt;let dist=Math.hypot(r.x-ship.x,r.y-ship.y);if(!inv&&dist<r.r*.78+11){hp--;inv=1.6;shake=8;burst(ship.x,ship.y,'#efb288');r.y=H+100;if(hp<=0){end();break}}else if(!r.passed&&r.y>ship.y+r.r&&Math.abs(r.x-ship.x)<r.r+38){score+=25;r.passed=true;burst(ship.x,ship.y,'#c4e5c9',5)}}
for(let o of orbs){o.y+=110*dt;if(Math.hypot(o.x-ship.x,o.y-ship.y)<26){hp=Math.min(3,hp+1);score+=80;o.y=H+80;burst(ship.x,ship.y,'#b9e9ce')}}rocks=rocks.filter(r=>r.y<H+60);orbs=orbs.filter(o=>o.y<H+40);hud()}
function draw(dt){ctx.fillStyle='#070d13';ctx.fillRect(0,0,W,H);let g=ctx.createRadialGradient(W*.7,H*.3,10,W*.7,H*.3,W*.8);g.addColorStop(0,'#152d36');g.addColorStop(1,'#070d13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let s of stars){if(state==='playing')s.y=(s.y+dt*s.z*40)%H;ctx.fillStyle=`rgba(195,224,223,${s.z*.3})`;ctx.fillRect(s.x,s.y,s.z*.8,s.z*(state==='playing'?3:1))}
ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
for(let r of rocks){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.a);ctx.beginPath();r.shape.forEach((v,i)=>{let a=i/9*Math.PI*2;let x=Math.cos(a)*r.r*v,y=Math.sin(a)*r.r*v;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='#25343b';ctx.fill();ctx.strokeStyle='#677c7d';ctx.lineWidth=1.2;ctx.stroke();ctx.beginPath();ctx.arc(-r.r*.2,-r.r*.15,r.r*.22,0,7);ctx.strokeStyle='#3c5055';ctx.stroke();ctx.restore()}
for(let o of orbs){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(time);ctx.strokeStyle='#b5e4bd';ctx.lineWidth=2;ctx.strokeRect(-8,-8,16,16);ctx.fillStyle='#b5e4bd';ctx.fillRect(-3,-3,6,6);ctx.restore()}
if(state!=='over'){ctx.save();ctx.translate(ship.x,ship.y);ctx.globalAlpha=inv?(.45+.55*Math.abs(Math.sin(time*16))):1;if(state==='playing'){ctx.beginPath();ctx.moveTo(-5,14);ctx.lineTo(0,29+Math.random()*13);ctx.lineTo(5,14);ctx.fillStyle='#8fcac8';ctx.fill()}ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(15,17);ctx.lineTo(0,9);ctx.lineTo(-15,17);ctx.closePath();ctx.fillStyle='#e0eddd';ctx.fill();ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,9);ctx.strokeStyle='#71928b';ctx.stroke();if(inv){ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.strokeStyle='#b9e9ce66';ctx.stroke()}ctx.restore()}
for(let p of sparks){if(state!=='paused'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;sparks=sparks.filter(p=>p.life>0);ctx.restore()}
function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;if($('game').style.display==='block'){if(state==='playing')update(dt);draw(dt)}requestAnimationFrame(frame)}resize();requestAnimationFrame(frame);
$('landing').style.display='none';$('game').style.display='block';resize();
</script></html>
